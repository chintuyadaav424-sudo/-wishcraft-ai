<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WishCraft AI — Birthday Wish Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fff7fb,#f5f3ff);color:#1f1730}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}.brand{text-align:center;margin:12px 0 24px}.brand h1{margin:0;font-size:34px}.brand p{margin:8px 0;color:#6d6477}
.card{background:#fff;border:1px solid #eee6f2;border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(42,20,60,.08);margin-bottom:16px}
label{display:block;font-weight:700;margin:14px 0 7px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #ddd3e4;border-radius:12px;font-size:16px;background:#fff}textarea{min-height:85px;resize:vertical}
button{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer}.primary{width:100%;background:#7c3aed;color:#fff;margin-top:18px}.secondary{background:#f2eaff;color:#5b21b6;margin-top:12px}
.result{white-space:pre-wrap;line-height:1.65;font-size:17px}.hidden{display:none}.premium{border:1px solid #e7d5ff;background:#fbf8ff}.small{font-size:13px;color:#756b80}.status{margin-top:10px;font-size:14px}
@media(max-width:520px){.brand h1{font-size:28px}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>🎂 WishCraft AI</h1>
    <p>Create a personal birthday wish in seconds.</p>
  </div>

  <div class="card">
    <label for="name">Name</label>
    <input id="name" placeholder="e.g. Rahul">

    <label for="relation">Relationship</label>
    <select id="relation">
      <option>Friend</option><option>Best Friend</option><option>Brother</option>
      <option>Sister</option><option>Mother</option><option>Father</option>
      <option>Partner</option><option>Colleague</option><option>Other</option>
    </select>

    <label for="tone">Tone</label>
    <select id="tone"><option>Emotional</option><option>Funny</option><option>Sweet</option><option>Short & classy</option></select>

    <label for="language">Language</label>
    <select id="language"><option>English</option><option>Hindi</option><option>Hinglish</option></select>

    <label for="detail">One personal detail (optional)</label>
    <textarea id="detail" placeholder="e.g. We have been friends since school..."></textarea>

    <button class="primary" id="generate">✨ Generate Wish</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <h2>Your Wish</h2>
    <div class="result" id="result"></div>
    <button class="secondary" id="copy">Copy Wish</button>
  </div>

  <div class="card premium">
    <h2>🎁 WishCraft Premium — ₹99</h2>
    <p>Get a premium birthday bundle: multiple wish styles, captions, status ideas and printable card text.</p>
    <button class="primary" id="pay">Unlock Premium</button>
    <p class="small">Payment opens only after the backend is configured with Razorpay.</p>
  </div>
</div>

<script>
async function generateWish(){
  const payload={
    name:document.querySelector('#name').value.trim(),
    relation:document.querySelector('#relation').value,
    tone:document.querySelector('#tone').value,
    language:document.querySelector('#language').value,
    detail:document.querySelector('#detail').value.trim()
  };
  if(!payload.name){document.querySelector('#status').textContent='Please enter a name.';return;}
  document.querySelector('#status').textContent='Generating...';
  try{
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'Generation failed');
    document.querySelector('#result').textContent=data.text;
    document.querySelector('#resultCard').classList.remove('hidden');
    document.querySelector('#status').textContent='';
  }catch(e){document.querySelector('#status').textContent=e.message;}
}
document.querySelector('#generate').onclick=generateWish;
document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(document.querySelector('#result').textContent);
document.querySelector('#pay').onclick=async()=>{
  document.querySelector('#status').textContent='Creating secure checkout...';
  try{
    const r=await fetch('/api/create-order',{method:'POST'});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'Payment setup failed');
    const options={key:data.key,amount:data.amount,currency:data.currency,name:'WishCraft AI',description:'WishCraft Premium',order_id:data.order_id,
      handler:function(resp){alert('Payment successful. Payment ID: '+resp.razorpay_payment_id);},
      theme:{color:'#7c3aed'}};
    if(!window.Razorpay) throw new Error('Razorpay checkout script not loaded.');
    new Razorpay(options).open();
  }catch(e){document.querySelector('#status').textContent=e.message;}
};
</script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
